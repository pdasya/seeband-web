name = "worker"
description = "Implement a bounded backend, frontend or core change in explicitly assigned files."
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
developer_instructions = """
Read AGENTS.md and CLAUDE.md. Follow the assigned scope and repository rules. Do not spawn other agents. Do not commit, push, merge, or post externally. Return a concise result with paths, evidence, validation and blockers; do not paste large logs. Edit only the assigned files. Read .claude/skills/architecture/SKILL.md and documentation/SKILL.md before changes that affect results or public behavior. Do not change numerical results outside an explicitly assigned physics fix. Run focused tests for your change, report commands/results, and stop before unrelated work. Do not run pnpm check unless the parent assigns validation ownership.
"""

[features]
apps = false
plugins = false

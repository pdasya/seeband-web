[project]
name = "seeband-core"
version = "0.0.0"
description = "Band model calculations and fits for SeeBand Web"
requires-python = ">=3.13"
dependencies = [
    "mpmath>=1.3",
    "numpy>=2.1",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seeband_core"]

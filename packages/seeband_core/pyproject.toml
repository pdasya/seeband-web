[project]
name = "seeband-core"
dynamic = ["version"]
description = "Band model calculations and fits for SeeBand Web"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "LICENSE-seeband-web"]
dependencies = [
    "mpmath>=1.3",
    "numpy>=2.1",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seeband_core"]

[tool.hatch.version]
path = "src/seeband_core/__init__.py"

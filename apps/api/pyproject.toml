[project]
name = "seeband-api"
version = "0.0.0"
description = "HTTP API over seeband_core"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "seeband-core",
]

[tool.uv.sources]
seeband-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seeband_api"]

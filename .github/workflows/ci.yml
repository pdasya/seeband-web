name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Built package
        run: |
          uv build --wheel --package seeband-core --out-dir dist
          wheel="$PWD/$(ls dist/*.whl)"
          for file in seeband_core/data/fermi_int_-10_20.txt seeband_core/data/demo_dataset.json seeband_core/data/neural_nets/net_100_400.npz seeband_core/data/neural_nets/net_200_500.npz seeband_core/data/neural_nets/net_300_600.npz seeband_core/data/neural_nets/net_300_800.npz seeband_core/data/neural_nets/net_400_700.npz licenses/LICENSE licenses/LICENSE-seeband-web; do
            unzip -l "$wheel" | grep -q "$file"
          done
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.13 --with "$wheel" python -c "
          import seeband_core
          import numpy as np
          from seeband_core import fit_module, math_module, neural_nets
          assert 'site-packages' in seeband_core.__file__
          assert math_module.fermi1_10.shape == (30000, 2)
          temperature_k = np.linspace(100.0, 800.0, 8)
          guess = neural_nets.predict_band_parameters(temperature_k, 1e-7 * temperature_k)
          assert guess.range_k == (300, 800)
          from seeband_core.demo_dataset import load_demo_dataset
          assert load_demo_dataset().synthetic is True
          "

  python-tests:
    name: Python tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One BLAS thread per test worker, as the API's fit processes run. With a thread per CPU in
    # each of the workers, the fits of core-fits took four times as long.
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: golden
            path: packages/seeband_core/tests/test_golden_regression.py
            exclude: ""
          - suite: core-fits
            path: >-
              packages/seeband_core/tests/test_verified_fit.py
              packages/seeband_core/tests/test_band_models.py
            exclude: ""
          - suite: core
            path: packages/seeband_core/tests
            exclude: >-
              --ignore=packages/seeband_core/tests/test_golden_regression.py
              --ignore=packages/seeband_core/tests/test_verified_fit.py
              --ignore=packages/seeband_core/tests/test_band_models.py
          - suite: api
            path: apps/api/tests
            exclude: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # No timed stack dumps, which are implicated in #285. A hang still gets one stack: after 30
      # minutes `timeout` sends SIGABRT, and pytest's faulthandler prints every thread before exit.
      # One worker per CPU. Tests that assert wall-clock latency are marked `timing` and run
      # alone afterwards, as other workers on the same CPUs would make them slow, not wrong.
      - name: Pytest in parallel, with test names and durations
        run: >-
          uv run timeout --signal=ABRT --kill-after=1m 30m
          pytest ${{ matrix.path }} ${{ matrix.exclude }} -m "not timing and not extended"
          -n auto -vv -x --tb=short --durations=20
      # Exit code 5 is "no tests collected": not every group has such tests.
      - name: Pytest of wall-clock latency, alone
        run: >-
          uv run timeout --signal=ABRT --kill-after=1m 15m
          pytest ${{ matrix.path }} ${{ matrix.exclude }} -m "timing and not extended"
          -vv -x --tb=short --durations=5
          || test $? -eq 5

  python-extended:
    name: Python tests (extended)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Reads the description now, not from the event, so ticking the box and re-running works.
      - name: Decide whether to run the extended regressions
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Whole outputs into variables first: `grep -q` in a pipe can end the writer early, which
        # under pipefail would read as "not requested".
        run: |
          reason=""
          if [ "$EVENT" = push ]; then
            reason="a push to main"
          else
            body=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            if grep -qiF '[x] Run extended core regressions' <<< "$body"; then
              reason="the pull request asks for them"
            elif grep -q '^packages/seeband_core/src/' <<< "$changed"; then
              reason="the pull request changes packages/seeband_core/src"
            fi
          fi
          if [ -n "$reason" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Extended regressions run: $reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Extended regressions skipped: the core is unchanged and they were not requested." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.decide.outputs.run == 'true'
        with:
          enable-cache: true
      - if: steps.decide.outputs.run == 'true'
        run: uv sync --locked
      - name: Extended core regressions
        if: steps.decide.outputs.run == 'true'
        run: >-
          uv run timeout --signal=ABRT --kill-after=1m 45m
          pytest packages/seeband_core/tests -m extended -vv -x --tb=short --durations=3

  # Keep the protected check name, and require every independent Python job.
  python:
    name: Python
    if: ${{ always() }}
    needs: [python-checks, python-tests, python-extended]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require checks, package and all test groups
        env:
          PYTHON_CHECKS_RESULT: ${{ needs.python-checks.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
          PYTHON_EXTENDED_RESULT: ${{ needs.python-extended.result }}
        run: |
          test "$PYTHON_CHECKS_RESULT" = success
          test "$PYTHON_TESTS_RESULT" = success
          test "$PYTHON_EXTENDED_RESULT" = success

  typescript-checks:
    name: TypeScript checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint and Prettier
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests of the other packages, including that generated API types are up to date
        run: pnpm -r --if-present --filter '!@seeband/web' run test
      - name: Unit tests and build test of the app
        run: pnpm --filter @seeband/web run test:unit

  # The e2e suite took 7-10 minutes on one hosted runner; three shards take about a third each.
  typescript-e2e:
    name: TypeScript e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser for the tests of the app
        run: pnpm --filter @seeband/web exec playwright install --with-deps chromium
      - name: E2E tests, shard ${{ matrix.shard }} of 3
        run: pnpm --filter @seeband/web run test:e2e --shard=${{ matrix.shard }}/3

  # Keep the protected check name, and require every TypeScript job.
  typescript:
    name: TypeScript
    if: ${{ always() }}
    needs: [typescript-checks, typescript-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require checks, unit tests and every e2e shard
        env:
          CHECKS_RESULT: ${{ needs.typescript-checks.result }}
          E2E_RESULT: ${{ needs.typescript-e2e.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$E2E_RESULT" = success

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the stack
        env:
          SEEBAND_COMMIT: ${{ github.sha }}
        run: docker compose -f deploy/compose.yaml up --build --detach --wait --wait-timeout 180
      - name: Site, app and API answer through Caddy
        run: |
          base=http://localhost:8080
          # Caddy has no health check of its own; wait for it to listen.
          curl -fsS --retry 15 --retry-delay 1 --retry-all-errors "$base/" | grep -q "<title>SeeBand Web</title>"
          curl -fsS "$base/guide/" | grep -q "User guide"
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$base/guide")" = "308 $base/guide/"
          curl -fsS "$base/fit" | grep -q '<div id="root">'
          # The site's icons, which the app's screens link too.
          for icon in favicon.svg favicon.ico apple-touch-icon.png; do
            curl -fsS -o /dev/null "$base/$icon"
            curl -fsS "$base/fit" | grep -q "href=\"/$icon\""
          done
          curl -fsSI "$base/fit" | grep -qi "x-robots-tag: noindex"
          # Built for no public address, every answer keeps search engines out.
          curl -fsSI "$base/" | grep -qi "x-robots-tag: noindex"
          curl -sI "$base/nope" | grep -qi "^HTTP/1.1 404"
          curl -sI "$base/nope" | grep -qi "x-frame-options: deny"
          curl -fsS "$base/api/ready" | grep -q '"ready"'
          curl -fsS "$base/api/health" | grep -q "\"commit\":\"${GITHUB_SHA:0:12}\""
          # A calculation runs in the API's worker processes, behind the proxy.
          curl -fsS "$base/api/calc" -H "Content-Type: application/json" -d '{
            "model": "spb", "fit_mode": "spb_s", "scattering": "acPh",
            "parameters": {"band_mass": 1.01, "fermi_energy": 100},
            "min_temperature_k": 50, "max_temperature_k": 800
          }' | grep -q '"curves"'
      - name: Containers run hardened
        run: |
          compose="docker compose -f deploy/compose.yaml"
          test "$($compose exec -T api id -u)" != 0
          for service in api web; do
            id=$($compose ps -q "$service")
            test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = true
            docker inspect -f '{{.HostConfig.CapDrop}}' "$id" | grep -q ALL
          done
          test "$(docker inspect -f '{{.HostConfig.Init}}' "$($compose ps -q api)")" = true
      - name: Logs hold no addresses or headers
        run: |
          base=http://localhost:8080
          curl -fsS -A "secret-agent" "$base/" > /dev/null
          curl -s -A "secret-agent" "$base/nope" > /dev/null
          logs=$(docker compose -f deploy/compose.yaml logs --no-color web)
          echo "$logs" | grep -q '"uri":"/"'
          if echo "$logs" | grep -E 'secret-agent|remote_ip|client_ip|X-Forwarded-For'; then exit 1; fi
      - name: The deploy script keeps a good tag and rolls back from a failing one
        working-directory: deploy
        env:
          SEEBAND_IMAGE_PREFIX: seeband
          SEEBAND_DEPLOY_PULL: "0"
        run: |
          health=http://localhost:8080/api/health
          # The images report this commit, so this tag passes the check of the commit.
          good=sha-${GITHUB_SHA:0:12}
          for name in api web; do docker tag "seeband-$name:local" "seeband-$name:$good"; done
          bash deploy.sh "$good" "$health"
          test "$(cat .deployed-tag)" = "$good"
          # Removed after the deploy: images of tags other than the running and previous ones.
          if docker image inspect seeband-api:local >/dev/null 2>&1; then exit 1; fi
          # A tag whose API reports another commit: the script must go back to the tag before it,
          # and that tag's check must pass.
          bad=sha-000000000000
          for name in api web; do docker tag "seeband-$name:$good" "seeband-$name:$bad"; done
          if bash deploy.sh "$bad" "$health" 2>rollback.log; then exit 1; fi
          cat rollback.log
          grep -q "Rolled back to $good" rollback.log
          test "$(cat .deployed-tag)" = "$good"
          test "$(docker compose -f compose.yaml ps --format '{{.Image}}' api)" = "seeband-api:$good"
          curl -fsS http://localhost:8080/api/ready | grep -q '"ready"'
          # A new Compose file waits beside the running one; a rollback uses the file it replaced.
          sed 's/mem_limit: ${SEEBAND_MEM_LIMIT_API:-3g}/mem_limit: 1m/' compose.yaml > compose.yaml.new
          if bash deploy.sh "$bad" "$health" 2>rollback.log; then exit 1; fi
          grep -q "Rolled back to $good" rollback.log
          test "$(cat .deployed-tag)" = "$good"
          curl -fsS http://localhost:8080/api/ready | grep -q '"ready"'
          git checkout -- compose.yaml
      - name: Logs
        if: always()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
